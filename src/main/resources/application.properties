# ==========================================
# 1. CONFIGURACION GLOBAL
# ==========================================
spring.application.name=fp-api

# IMPORTANTE: Usamos la variable de entorno PORT si existe
server.port=${PORT:5000}

# Tu clave JWT
jwt.secret=${JWT_SECRET}

# ==========================================
# 2. CONFIGURACION JPA / HIBERNATE
# ==========================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANTE: 'none' para no borrar tablas
spring.jpa.hibernate.ddl-auto=none

# ==========================================
# 3. CONEXION CLOUD (AIVEN - MySQL)
# ==========================================
# Variables con valores por defecto para local

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver y Dialecto
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect